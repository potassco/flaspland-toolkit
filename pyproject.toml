[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "flaspland"
authors = [{ name = "Ryan Kepler J. Murphy", email = "ryan.murphy@uni-potsdam.de" }]
description = "Generate Flatland railway environments and solve them with answer set programming (clingo)."
# >=3.11 for tomllib (build.py); <3.13 because flatland-rl needs numpy<2, which has no wheels for 3.13+
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
dynamic = ["version"]
readme = "README.md"
dependencies = [
    # pinned to a minor release: flatland moves modules between releases, which breaks
    # the code and makes saved .pkl environments unloadable
    "flatland-rl>=4.3,<4.4",
    "clingo>=5.6",
    "imageio",
    "Pillow",
]

[project.urls]
Homepage = "https://github.com/potassco/flaspland-toolkit"

[project.optional-dependencies]
format = ["black", "isort", "autoflake"]
lint_pylint = ["pylint"]
typecheck = ["types-setuptools", "mypy"]
test = ["coverage[toml]"]
doc = ["mkdocs<2", "mkdocs-material", "mkdocstrings[python]", "mkdoclingo"]
dev = ["flaspland[test,typecheck,lint_pylint]"]

# The tools are run as scripts from src/flaspland (see README), so installing the
# project only installs its dependencies; there is no package to install yet.
[tool.setuptools]
packages = []

[tool.setuptools_scm]
version_scheme = "python-simplified-semver"
local_scheme = "no-local-version"
# used when there is no git metadata, e.g. when the repository was downloaded as a ZIP file
fallback_version = "0.0.0"

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120

[tool.pylint.format]
max-line-length = 120

[tool.pylint.design]
max-args = 10
max-attributes = 7
max-bool-expr = 5
max-branches = 12
max-locals = 30
max-parents = 7
max-public-methods = 20
max-returns = 10
max-statements = 50
min-public-methods = 1

[tool.pylint.similarities]
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true

[tool.pylint.basic]
argument-rgx = "^[a-z][a-z0-9]*((_[a-z0-9]+)*_?)?$"
variable-rgx = "^[a-z][a-z0-9]*((_[a-z0-9]+)*_?)?$"
good-names = ["_"]

[tool.coverage.run]
source = ["flaspland", "tests"]
omit = ["*/flaspland/__main__.py"]

[tool.coverage.report]
exclude_lines = ["assert", "nocoverage"]
